<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="ChatGPT" />
    <meta name="description" content="Have fun!" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="https://use.typekit.net/uvw6kcx.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fav.png" type="image/png">
    <title>Number Guessing Game</title>

    <style>
        body {
            margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
    color: white;
    font-family: "Happy Monkey", system-ui;
        }

        .game {
            width: 100%;
    padding: 30px;
    background: #222;
    border-radius: 15px;
    box-sizing: border-box;
    box-shadow: 0 0 20px #000;
            
        }

        h1 {
            margin-top: 0;
        }

        input {
            font-family:'Times New Roman', Times, serif;
            width: 80%;
            padding: 12px;
            margin: 15px 0;
            font-size: 18px;
            text-align: center;
            border: none;
            border-radius: 8px;
        }

        button {
            font-family: "Happy Monkey", system-ui;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #099FFF;
            color: white;
        }

        button:hover {
            background:#099FFF;
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
            min-height: 25px;
        }
        #h {
            font-family: "jinky", sans-serif;
    font-size: 53px;
    margin: 0 0 15px;
        }
        #attempts {
            color: #aaa;
        }
        .container{
            width: 91%;
    max-width: 600px;
    text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
<h1 id="h">Zibble Fun</h1>

    <div class="game">
        <h1>Number Guessing</h1>

        <p>I have picked a number between 1 and 100.</p>
        <p>Try to guess it!</p>

        <input
            type="number"
            id="guess"
            min="1"
            max="100"
            placeholder="Enter your guess"
        >

        <br>

<button id="gameButton" onclick="checkGuess()">Guess!</button>

        <p id="message"></p>
        <p id="attempts">Attempts: 0</p>
   <!--    
   <p style="font-size:5px; margin-top:20px; color:#aaa;">© Jayad Al Sabit</p> 
   -->
    </div>
    </div>

    <script>
        // Generate a random number between 1 and 100
        let secretNumber = Math.floor(Math.random() * 100) + 1;

        let attempts = 0;

        function checkGuess() {
    const input = document.getElementById("guess");
    const message = document.getElementById("message");
    const attemptsText = document.getElementById("attempts");
    const button = document.getElementById("gameButton");

    const guess = Number(input.value);

    if (guess < 1 || guess > 100 || input.value === "") {
        message.textContent = "Please enter a number between 1 and 100!";
        return;
    }

    attempts++;

    if (guess > secretNumber) {
        message.textContent = "Are you dumb? 😭 It's too high!";
    }
    else if (guess < secretNumber) {
        message.textContent = "Too low! 📉";
    }
    else {
        message.textContent =
            "🎉 Congratulations! You guessed " +
            secretNumber +
            " in " +
            attempts +
            " attempts!";

        // Disable the input
        input.disabled = true;

        // Turn the Guess button into a Retry button
        button.textContent = "Retry 🔄";
        button.onclick = retryGame;
    }

    attemptsText.textContent = "Attempts: " + attempts;

    input.value = "";
    input.focus();
}

function retryGame() {
    // Generate a new secret number
    secretNumber = Math.floor(Math.random() * 100) + 1;

    // Reset attempts
    attempts = 0;

    // Reset the screen
    document.getElementById("message").textContent = "";
    document.getElementById("attempts").textContent = "Attempts: 0";

    // Enable the input again
    const input = document.getElementById("guess");
    input.disabled = false;
    input.value = "";
    input.focus();

    // Turn Retry back into Guess
    const button = document.getElementById("gameButton");
    button.textContent = "Guess!";
    button.onclick = checkGuess;
}

        // Allow pressing Enter instead of clicking the button
        document.getElementById("guess").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                checkGuess();
            }
        });
    </script>

</body>
</html>
