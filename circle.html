<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="https://use.typekit.net/uvw6kcx.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&display=swap" rel="stylesheet">

<link rel="stylesheet" href="fav.png" type="image/png">
<title>Circle Accuracy Test</title>

<style>
*{
box-sizing:border-box;
}

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
margin:0;
padding:0 10px;
overflow-x:hidden;
font-family: "Happy Monkey", system-ui;
}

h2{
margin-top:15px;
font-size:clamp(20px, 5vw, 28px);
}

canvas{
display:block;
background:white;
border:3px solid #444;
touch-action:none;

width:min(500px, 100%);
height:auto;

margin:15px auto;
}

#result{
font-size:clamp(28px, 8vw, 35px);
font-weight:bold;
margin:20px;
}

button{
font-family: "Happy Monkey", system-ui;
padding: 12px 25px;
            font-size: 18px;
     border: none;
            border-radius: 8px;
      cursor: pointer;
            background: #099FFF;
         color: white;
}
 #h {
    font-family: "jinky", sans-serif;
    text-align:center; font-size:53px;
   
 }
</style>

</head>

<body>
<h1 id="h">Zibble Fun</h1>
<h2>Draw a Circle Around the Dot</h2>

<canvas id="canvas" width="500" height="500"></canvas>

<div id="result">Draw!</div>

<button onclick="retry()">Retry</button>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const dotX=250;
const dotY=250;

let drawing=false;
let points=[];

function resetCanvas(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="black";
ctx.beginPath();
ctx.arc(dotX,dotY,5,0,Math.PI*2);
ctx.fill();

points=[];

}

resetCanvas();

function getPos(e){

const rect=canvas.getBoundingClientRect();

let x,y;

if(e.touches){

x=(e.touches[0].clientX-rect.left)
  *(canvas.width/rect.width);

y=(e.touches[0].clientY-rect.top)
  *(canvas.height/rect.height);

}else{

x=(e.clientX-rect.left)
  *(canvas.width/rect.width);

y=(e.clientY-rect.top)
  *(canvas.height/rect.height);

}

return {x,y};

}

canvas.onmousedown=start;
canvas.onmousemove=move;
canvas.onmouseup=end;
canvas.onmouseleave=end;

canvas.ontouchstart=start;
canvas.ontouchmove=move;
canvas.ontouchend=end;

function start(e){

drawing=true;

const p=getPos(e);

points=[p];

ctx.beginPath();
ctx.moveTo(p.x,p.y);

}

function move(e){

if(!drawing)return;

e.preventDefault();

const p=getPos(e);

points.push(p);

ctx.lineTo(p.x,p.y);
ctx.strokeStyle="blue";
ctx.lineWidth=3;
ctx.stroke();

}

function end(){

if(!drawing)return;

drawing=false;

calculate();

}

function calculate(){

if(points.length<20)return;

let cx=0;
let cy=0;

points.forEach(p=>{
cx+=p.x;
cy+=p.y;
});

cx/=points.length;
cy/=points.length;

let radii=[];

points.forEach(p=>{
radii.push(Math.hypot(p.x-cx,p.y-cy));
});

let avg=radii.reduce((a,b)=>a+b,0)/radii.length;

let error=0;

radii.forEach(r=>{
error+=Math.abs(r-avg);
});

error/=radii.length;

let accuracy=Math.max(
0,
100-(error/avg)*300
);

accuracy=Math.round(accuracy);

const result=document.getElementById("result");

result.innerHTML=accuracy+"%";

if(accuracy<=50){

result.style.color="red";

}else if(accuracy<=75){

result.style.color="yellow";

}else if(accuracy<=89){

result.style.color="yellowgreen";

}else{

result.style.color="lime";

}

}

function retry(){

resetCanvas();

document.getElementById("result").innerHTML="Draw!";
document.getElementById("result").style.color="white";

}

</script>

</body>
</html>
